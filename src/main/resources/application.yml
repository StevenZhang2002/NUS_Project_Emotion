spring:
  application:
    name: demo
  data:
    redis:
      host:
      port:
      password:

  rabbitmq:
    host:
    port:
    virtual-host:
    username:
    password:
    requested-heartbeat:
    connection-timeout:


  datasource:
    url:
    username:
    password:
  mail:
    host: smtp.163.com
    username:
    password:
    protocol: smtp
    port: 465
    default-encoding: utf-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory


mybatis:
  configuration:
    map-underscore-to-camel-case: true

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.example.demo.Controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn